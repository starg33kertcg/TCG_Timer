<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Timer Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/viewer.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/tone@14.9.14/build/Tone.min.js"></script>
</head>
<body>
    <!-- Audio Overlay -->
    <div id="audio-start-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; justify-content: center; align-items: center; z-index: 2000; cursor: pointer;">
        <div style="text-align: center;">
            <h1 style="font-size: 4em; margin-bottom: 20px;">🔊 Click Anywhere to Enable Audio</h1>
            <p style="font-size: 1.5em; color: #ccc;">Modern browsers require interaction before sounds can play.</p>
        </div>
    </div>

    <!-- Signage Overlay -->
    <div id="signage-overlay">
        <img id="signage-image" src="" alt="Signage">
    </div>

    <!-- Application Container -->
    <div class="timer-container" id="app-container">
        <!-- Generates 4 timer blocks -->
        {% for i in range(1, 5) %}
        <div id="timer-{{ i }}-wrapper" class="timer-wrapper" style="display:none;">
            <img id="timer-{{ i }}-logo" class="logo-img" style="display:none;">
            <div id="timer-{{ i }}-text" class="timer-text">00:00:00</div>
        </div>
        {% endfor %}
        
        <!-- Promo Graphic Block -->
        <div id="promo-wrapper" class="promo-wrapper" style="display:none;"></div>
    </div>
    
    <script src="{{ url_for('static', filename='js/viewer.js') }}"></script>
</body>
</html>
